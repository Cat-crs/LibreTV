name: Sync LibreTV Upstream

on:
  schedule:
    # 每天 UTC 时间 8 点运行（相当于北京时间 16 点）
    - cron: '0 8 * * *'
  workflow_dispatch:       # 允许手动触发
  push:
    branches: [ main ]     # 当 main 分支有推送时也运行（可选）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LibreTV Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史记录

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from LibreSpark/LibreTV
        run: |
          echo "开始同步 LibreTV 上游更新..."
          
          # 添加上游仓库
          git remote add upstream https://github.com/LibreSpark/LibreTV.git || true
          
          # 获取上游更新
          echo "获取上游更改..."
          git fetch upstream
          
          # 切换到主分支
          git checkout main
          
          # 尝试合并上游更改
          echo "合并上游更改..."
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "✅ 合并成功，推送更改到 fork..."
            git push origin main
            echo "🎉 同步完成！"
          else
            echo "❌ 检测到合并冲突！需要手动处理。"
            git merge --abort
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
