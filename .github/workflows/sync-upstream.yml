name: Sync LibreTV Upstream

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LibreTV Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from LibreSpark/LibreTV
        run: |
          echo "开始同步 LibreTV 上游更新..."
          
          # 添加上游仓库
          git remote add upstream https://github.com/LibreSpark/LibreTV.git || true
          
          # 获取上游更新
          echo "获取上游更改..."
          git fetch upstream
          
          # 切换到主分支
          git checkout main
          
          # 尝试合并上游更改
          echo "合并上游更改..."
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "✅ 合并成功，强制推送到 fork..."
            # 使用 --force-with-lease 安全地强制推送
            git push --force-with-lease origin main
            echo "🎉 同步完成！"
          else
            echo "❌ 检测到合并冲突！需要手动处理。"
            git merge --abort
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          git checkout main
          
          # 尝试合并上游更改
          echo "合并上游更改..."
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "✅ 合并成功，推送更改到 fork..."
            git push origin main
            echo "🎉 同步完成！"
          else
            echo "❌ 检测到合并冲突！需要手动处理。"
            git merge --abort
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
